services:
  - type: web
    name: teleygram-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CARD_NUMBER
        sync: false
      - key: CARD_HOLDER
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: PUBLIC_URL
        fromService:
          type: web
          name: teleygram-bot
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: teleygram-db
          property: connectionString

databases:
  - name: teleygram-db
    plan: free
    databaseName: teleygram
    user: teleygram
